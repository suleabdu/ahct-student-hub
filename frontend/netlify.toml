[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Every page here is a plain static file (index.html, student-login.html,
# etc.) — no client-side router, so no catch-all redirect is needed.
